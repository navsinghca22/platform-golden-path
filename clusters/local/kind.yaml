kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: golden-path-local
nodes:
  - role: control-plane
    # Host port 8080 -> NodePort 30080, so the sample app is reachable at
    # http://localhost:8080 without a port-forward. Argo CD's UI uses a
    # port-forward instead (see `make argocd-ui`) because we do not want a
    # long-lived listener bound to the host for the control plane.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
