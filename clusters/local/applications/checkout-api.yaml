# Dropping this file into clusters/local/applications/ is the entire
# onboarding process. The root app finds it and Argo CD does the rest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: checkout-api
  namespace: argocd
  labels:
    platform.golden-path.io/owner: team-checkout
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/navsinghca22/platform-golden-path.git
    targetRevision: main
    path: apps/checkout-api/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: checkout-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
