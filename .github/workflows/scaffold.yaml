# The developer-facing form.
#
# This is the "portal" -- deliberately not Backstage. A GitHub Actions form is
# something every engineer at the company already has access to, already knows
# how to use, and that the platform team does not have to operate. See
# docs/adr/0003-scaffolder-not-backstage.md.
#
# It opens a pull request rather than pushing to main, which keeps the paved
# road inside code review: the generated service is visible, diffable and
# rejectable before anything reaches a cluster.
name: scaffold new service

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Service name (lowercase, hyphens; e.g. checkout-api)"
        required: true
        type: string
      owner:
        description: "Owning team (e.g. team-checkout)"
        required: true
        type: string
      image:
        description: "Container image with an explicit tag (not :latest)"
        required: true
        type: string
        default: "ghcr.io/stefanprodan/podinfo:6.11.2"
      port:
        description: "HTTP port the service listens on"
        required: true
        type: string
        default: "9898"
      storage:
        description: "Also provision an S3 bucket for this service"
        required: false
        type: boolean
        default: false
      region:
        description: "AWS region (only used if storage is requested)"
        required: false
        type: choice
        options: ["us-east-1", "us-west-2", "eu-west-1"]
        default: "us-east-1"

permissions:
  contents: write
  pull-requests: write

jobs:
  scaffold:
    name: generate service and open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scaffold
        id: scaffold
        run: |
          set -euo pipefail
          ARGS=(--name "${{ inputs.name }}"
                --owner "${{ inputs.owner }}"
                --image "${{ inputs.image }}"
                --port "${{ inputs.port }}"
                --region "${{ inputs.region }}")
          if [ "${{ inputs.storage }}" = "true" ]; then
            ARGS+=(--storage)
          fi
          python3 scripts/scaffold.py "${ARGS[@]}"

      # The generated service is validated by the same script CI uses on every
      # PR. A scaffolder that can emit manifests its own pipeline would reject
      # is a scaffolder nobody trusts twice.
      - name: Validate generated manifests
        run: |
          set -euo pipefail
          command -v kubeconform >/dev/null 2>&1 || {
            mkdir -p "$HOME/.local/bin"
            curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" \
              | tar -xz -C "$HOME/.local/bin" kubeconform
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          }
          export PATH="$HOME/.local/bin:$PATH"
          kustomize build "apps/${{ inputs.name }}/overlays/local" \
            | kubeconform -strict -summary -ignore-missing-schemas -schema-location default

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="scaffold/${{ inputs.name }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat: scaffold ${{ inputs.name }}

          Generated from templates/service by scripts/scaffold.py.
          Owner: ${{ inputs.owner }}
          Image: ${{ inputs.image }}
          Storage requested: ${{ inputs.storage }}"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "feat: scaffold ${{ inputs.name }}" \
            --body "$(cat <<'BODY'
          Generated by the golden-path scaffolder.

          **What this service gets without asking for it**

          - liveness and readiness probes
          - resource requests and limits
          - hardened securityContext (non-root with a numeric UID, no privilege
            escalation, read-only root filesystem, all capabilities dropped)
          - a writable `/tmp`, so the hardening above does not CrashLoop
          - Prometheus scrape annotations
          - an Argo CD Application, so merging this PR is the deploy

          **Review checklist**

          - [ ] image tag is pinned and correct
          - [ ] port matches what the app actually listens on
          - [ ] owning team is right
          BODY
          )" \
            --head "$BRANCH" --base main
