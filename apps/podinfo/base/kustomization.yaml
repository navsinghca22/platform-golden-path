apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Non-selector labels only. `includeSelectors: true` would write these into the
# Deployment's spec.selector, which is immutable after creation -- a small trap
# that bites the first time someone edits this file six months from now.
labels:
  - pairs:
      app.kubernetes.io/part-of: golden-path
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

resources:
  - deployment.yaml
  - service.yaml
