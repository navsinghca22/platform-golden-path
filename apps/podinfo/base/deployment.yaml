apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo
      annotations:
        # Scraped by Prometheus in Lab 3. Present from day one so that
        # observability is opt-out rather than opt-in.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9797"
    spec:
      securityContext:
        # Enforce the invariant (must not be root) without asserting a specific
        # UID. Pinning runAsUser here would silently break the moment the
        # upstream image changes its user -- a bad trade for a platform default
        # that every scaffolded service inherits.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.11.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP
            - name: http-metrics
              containerPort: 9797
              protocol: TCP
          command:
            - ./podinfo
            - --port=9898
            - --port-metrics=9797
            - --level=info
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Defaults, not suggestions. A service scaffolded from the golden
          # path is schedulable and bounded without the team thinking about it.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # readOnlyRootFilesystem is only safe if the writable paths the
          # process actually needs are provided explicitly. Skipping this is
          # the most common reason a "hardened" pod CrashLoops on first deploy.
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
